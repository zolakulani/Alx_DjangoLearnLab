<!DOCTYPE html>
<html><head><title>Add Book</title></head><body>
<h1>Add New Book</h1>
<form method="post">
    {% csrf_token %}
    <input type="text" name="title" placeholder="Book Title" required><br><br>
    <input type="number" name="author" placeholder="Author ID" required><br><br>
    <button type="submit">Add Book</button>
</form>
<a href="{% url 'relationship_app:list_books' %}">Back</a>
</body></html>
