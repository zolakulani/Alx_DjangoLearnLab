<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>List of Books</title>
</head>
<body>
    <h1>Books Available:</h1>
    {% if books %}
        <ul>
            {% for book in books %}
                <li>{{ book.title }} by {{ book.author.name }}</li>
            {% endfor %}
        </ul>
    {% else %}
        <p>No books available yet. Add some via admin!</p>
    {% endif %}
    <a href="{% url 'relationship_app:library_detail' pk=1 %}">View Sample Library</a>
</body>
</html>
